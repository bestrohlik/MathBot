<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MathBot</title>
    <link rel="icon" type="image/x-icon" href="icon.ico">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            color: white;

            background-image: url("background.gif");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
        }

        .container {
            position: relative;
            z-index: 1;

            text-align: center;
            padding: 50px;

            background: rgba(0, 0, 0, 0.65);
            border-radius: 25px;

            backdrop-filter: blur(8px);
        }

        h1 {
            font-size: 55px;
            margin: 0 0 10px;
        }

        p {
            font-size: 20px;
            margin-bottom: 30px;
        }

        .download {
            display: inline-block;

            padding: 15px 35px;

            background: #ffffff;
            color: #111;

            text-decoration: none;
            font-size: 20px;
            font-weight: bold;

            border-radius: 12px;

            transition: 0.2s;
        }

        .download:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="overlay"></div>

    <div class="container">
        <h1>MathBot</h1>

        <p>
            Tvůj matematický pomocník.
        </p>

        <a class="download" href="MathBot.zip" download>
            ⬇️ Download MathBot V1
        </a>
    </div>

</body>
</html>
